# Genera la LLAVE DE SUBIDA de Google Play para Marea (una sola vez).
#
# Cómo se usa (detalle en docs/google-play.md, sección "Llave de subida"):
#   1. Antes, crea el secreto ANDROID_KEYSTORE_BACKUP_PASSWORD con una frase larga que solo tú sepas
#      (guárdala en tu gestor de contraseñas). Con ella se cifra el archivo que vas a descargar.
#   2. GitHub → Actions → "Android: generar llave de subida" → Run workflow.
#   3. Descarga el artifact "marea-llave-android-CIFRADA.zip" y BÓRRALO de GitHub después.
#   4. Ábrelo con la frase (Mac: The Unarchiver o Keka; Windows: 7-Zip). Adentro vienen el .jks, el
#      certificado .pem y un archivo por cada secreto (ANDROID_KEYSTORE_BASE64, …) para copiarlos a GitHub.
#
# La contraseña de la llave se genera al azar y NUNCA se imprime en los registros: solo va dentro del
# .zip cifrado. Si ya generaste la llave en Codemagic (flujo android-generar-llave), NO corras este
# workflow: usa esa misma llave (Google Play acepta una sola llave de subida a la vez).

name: "Android: generar llave de subida"

on:
  workflow_dispatch:
    inputs:
      alias:
        description: "Alias de la llave (letras, números, punto, guion o guion bajo)"
        required: false
        type: string
        default: marea_upload
      nombre:
        description: "Nombre en el certificado, p. ej. tu nombre o el del estudio (no es público en la tienda)"
        required: false
        type: string
        default: Marea
      reemplazar:
        description: "Ya existe ANDROID_KEYSTORE_BASE64 y quiero OTRA llave (solo si perdiste la anterior y vas a pedir el restablecimiento en Play Console)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-keystore
  cancel-in-progress: false

jobs:
  llave:
    name: Generar llave de subida
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Revisar requisitos
        env:
          BACKUP_PASS: ${{ secrets.ANDROID_KEYSTORE_BACKUP_PASSWORD }}
          YA_EXISTE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          REEMPLAZAR: ${{ inputs.reemplazar }}
          ALIAS: ${{ inputs.alias }}
          NOMBRE: ${{ inputs.nombre }}
        run: |
          if [ -z "$BACKUP_PASS" ]; then
            echo "::error title=Falta la frase de respaldo::Crea primero el secreto ANDROID_KEYSTORE_BACKUP_PASSWORD (Settings → Secrets and variables → Actions) con una frase de al menos 12 caracteres. Con ella se cifra el archivo que vas a descargar."
            exit 1
          fi
          if [ ${#BACKUP_PASS} -lt 12 ]; then
            echo "::error title=Frase muy corta::ANDROID_KEYSTORE_BACKUP_PASSWORD debe tener al menos 12 caracteres."
            exit 1
          fi
          if [ "$YA_EXISTE" = "true" ] && [ "$REEMPLAZAR" != "true" ]; then
            echo "::error title=Ya tienes una llave::El secreto ANDROID_KEYSTORE_BASE64 ya existe. No generes otra: Google Play solo acepta la llave que registró. Si de verdad la perdiste, vuelve a correr con 'reemplazar' marcado y sigue la guía para pedir el restablecimiento."
            exit 1
          fi
          if ! [[ "$ALIAS" =~ ^[A-Za-z0-9._-]{1,64}$ ]]; then
            echo "::error title=Alias inválido::Usa solo letras, números, punto, guion o guion bajo (ahora: '$ALIAS')."
            exit 1
          fi
          if [ -z "$NOMBRE" ] || [ ${#NOMBRE} -gt 64 ] || [[ "$NOMBRE" == *[,\;=+\<\>#\"\\]* ]]; then
            echo "::error title=Nombre inválido::Escribe un nombre de hasta 64 caracteres sin comas, comillas ni símbolos (, ; = + < > # \" \\)."
            exit 1
          fi

      - name: Generar la llave
        env:
          ALIAS: ${{ inputs.alias }}
          NOMBRE: ${{ inputs.nombre }}
        run: |
          umask 077
          dir="$RUNNER_TEMP/llave/marea-llave-android"
          mkdir -p "$dir"

          # Contraseña aleatoria (48 caracteres hexadecimales). Se oculta en los registros por si acaso.
          PASS=$(openssl rand -hex 24)
          echo "::add-mask::$PASS"
          export PASS

          # PKCS12: la contraseña de la llave es la misma del almacén.
          # 10 000 días ≈ 27 años (Google pide que la llave sea válida al menos hasta 2033).
          keytool -genkeypair -noprompt \
            -keystore "$dir/marea-upload.jks" -storetype PKCS12 \
            -alias "$ALIAS" -keyalg RSA -keysize 4096 -validity 10000 \
            -dname "CN=$NOMBRE, O=Marea, C=MX" \
            -storepass:env PASS -keypass:env PASS > /dev/null 2>&1

          # Certificado PÚBLICO (.pem): se usa si algún día hay que pedir el restablecimiento de la llave.
          keytool -exportcert -rfc -keystore "$dir/marea-upload.jks" -alias "$ALIAS" \
            -storepass:env PASS -file "$dir/upload_certificate.pem" > /dev/null 2>&1

          # Un archivo por secreto de GitHub, con el valor exacto (sin salto de línea al final).
          base64 -w0 "$dir/marea-upload.jks" > "$dir/ANDROID_KEYSTORE_BASE64.txt"
          printf '%s' "$PASS"  > "$dir/ANDROID_KEYSTORE_PASSWORD.txt"
          printf '%s' "$ALIAS" > "$dir/ANDROID_KEY_ALIAS.txt"
          printf '%s' "$PASS"  > "$dir/ANDROID_KEY_PASSWORD.txt"

          listado=$(keytool -list -v -keystore "$dir/marea-upload.jks" -alias "$ALIAS" -storepass:env PASS 2>/dev/null || true)
          sha1=$(grep -m1 -E '^[[:space:]]*SHA1:' <<< "$listado" | sed -E 's/.*SHA1:[[:space:]]*//' || true)
          sha256=$(grep -m1 -E '^[[:space:]]*SHA256:' <<< "$listado" | sed -E 's/.*SHA256:[[:space:]]*//' || true)
          vence=$(grep -m1 -E 'until: ' <<< "$listado" | sed -E 's/.*until: //' || true)
          if [ -z "$sha256" ]; then
            echo "::error::No se pudo crear la llave."
            exit 1
          fi

          cat > "$dir/LEEME.txt" <<EOF
          LLAVE DE SUBIDA DE GOOGLE PLAY — MAREA
          ======================================

          Archivos:
            marea-upload.jks                 la llave (PRIVADA). No la subas al repositorio ni la mandes por chat.
            upload_certificate.pem           su certificado público (para pedir el restablecimiento si se pierde).
            ANDROID_KEYSTORE_BASE64.txt      valor del secreto ANDROID_KEYSTORE_BASE64
            ANDROID_KEYSTORE_PASSWORD.txt    valor del secreto ANDROID_KEYSTORE_PASSWORD
            ANDROID_KEY_ALIAS.txt            valor del secreto ANDROID_KEY_ALIAS   (alias: $ALIAS)
            ANDROID_KEY_PASSWORD.txt         valor del secreto ANDROID_KEY_PASSWORD

          Qué hacer:
            1. En GitHub: Settings → Secrets and variables → Actions → New repository secret.
               Crea los 4 secretos: el nombre es el del archivo (sin .txt) y el valor es TODO su contenido.
            2. Guarda esta carpeta completa en tu gestor de contraseñas (1Password, Bitwarden…) o en una
               memoria USB guardada en un lugar seguro. GitHub no deja volver a ver los secretos.
            3. Borra el archivo descargado de la carpeta Descargas y el artifact en GitHub.

          Huellas del certificado (no son secretas; Play Console las muestra en Integridad de la app):
            SHA-1:   $sha1
            SHA-256: $sha256
            Vence:   $vence
          EOF

          {
            echo "sha1=$sha1"
            echo "sha256=$sha256"
            echo "vence=$vence"
          } >> "$GITHUB_ENV"

      - name: Cifrar el respaldo
        env:
          BACKUP_PASS: ${{ secrets.ANDROID_KEYSTORE_BACKUP_PASSWORD }}
        run: |
          cd "$RUNNER_TEMP/llave"
          if command -v 7z > /dev/null; then z=7z
          elif command -v 7zz > /dev/null; then z=7zz
          else
            sudo apt-get update -qq > /dev/null && sudo apt-get install -y -qq p7zip-full > /dev/null
            z=7z
          fi
          # ZIP con cifrado AES-256 (lo abren The Unarchiver/Keka en Mac y 7-Zip en Windows).
          "$z" a -tzip -mem=AES256 -p"$BACKUP_PASS" -bso0 -bsp0 marea-llave-android-CIFRADA.zip marea-llave-android
          # Comprueba que se pueda abrir con la frase.
          "$z" t -p"$BACKUP_PASS" -bso0 -bsp0 marea-llave-android-CIFRADA.zip
          # Sin la frase NO debe abrirse.
          if "$z" t -p"no-es-la-frase" -bso0 -bse0 -bsp0 marea-llave-android-CIFRADA.zip > /dev/null 2>&1; then
            echo "::error::El archivo no quedó cifrado."
            exit 1
          fi
          # Fuera los archivos sin cifrar.
          find marea-llave-android -type f -exec shred -u {} + 2>/dev/null || rm -rf marea-llave-android
          rm -rf marea-llave-android

      - name: Guardar el respaldo cifrado (Artifacts)
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/llave/marea-llave-android-CIFRADA.zip
          archive: false
          if-no-files-found: error
          # Poco tiempo a propósito: descárgalo en cuanto termine y bórralo.
          retention-days: 3

      - name: Resumen
        env:
          ALIAS: ${{ inputs.alias }}
        run: |
          {
            echo "## Llave de subida de Google Play creada"
            echo ""
            echo "1. Descarga **marea-llave-android-CIFRADA.zip** (abajo, en *Artifacts*) y luego **bórralo** de aquí (ícono de basura)."
            echo "2. Ábrelo con la frase de \`ANDROID_KEYSTORE_BACKUP_PASSWORD\` (Mac: The Unarchiver o Keka · Windows: 7-Zip)."
            echo "3. Crea los secretos \`ANDROID_KEYSTORE_BASE64\`, \`ANDROID_KEYSTORE_PASSWORD\`, \`ANDROID_KEY_ALIAS\` y \`ANDROID_KEY_PASSWORD\` copiando el contenido de cada archivo .txt."
            echo "4. Guarda la carpeta en tu gestor de contraseñas o en una USB. No la subas al repositorio ni la mandes por chat."
            echo ""
            echo "| Dato (no secreto) | Valor |"
            echo "|---|---|"
            echo "| Alias | \`$ALIAS\` |"
            echo "| SHA-1 | \`$sha1\` |"
            echo "| SHA-256 | \`$sha256\` |"
            echo "| Vence | $vence |"
          } >> "$GITHUB_STEP_SUMMARY"
