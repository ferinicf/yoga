# Marea para iPhone y iPad: compila en una Mac de GitHub (en la nube) y sube a TestFlight.
# Es la alternativa para cuando no estás frente a tu Mac; con la Mac se hace desde Xcode
# (docs/app-store.md). La interfaz va EMPAQUETADA dentro de la app (export estático de Next en out/).
#
# Cuándo corre: solo a mano. GitHub → Actions → "iOS (TestFlight)" → Run workflow.
#
# Firma automática con la llave de la API de App Store Connect (sin certificados en el repo):
#   - El .xcarchive se compila sin firmar (así no se crea un certificado de desarrollo en cada
#     ejecución) y lo firma la exportación con el certificado de distribución que Apple administra
#     en la nube ("cloud signing"). Para eso la llave API debe tener rol **Admin**.
#   - La subida la hace el mismo xcodebuild (destination=upload), que es lo que usa Xcode al
#     "Distribuir" una app. No usa `altool --upload-app` (Apple lo marcó como obsoleto).
#
# Secretos (GitHub → Settings → Secrets and variables → Actions). Guía: docs/app-store.md
#   APP_STORE_CONNECT_KEY_ID          ID de la llave API (10 caracteres)
#   APP_STORE_CONNECT_ISSUER_ID       Issuer ID (formato 1a2b3c4d-…)
#   APP_STORE_CONNECT_KEY_P8_BASE64   el archivo AuthKey_XXXX.p8 en base64 (también acepta el texto del .p8)
#   APPLE_TEAM_ID                     Team ID de tu cuenta de Apple Developer (10 caracteres)

name: iOS (TestFlight)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión visible, p. ej. 1.0.1. Vacío = la del proyecto de Xcode (MARKETING_VERSION)"
        required: false
        type: string
      subir_a_testflight:
        description: "Subir a App Store Connect / TestFlight (si no, solo deja el .ipa en Artifacts)"
        required: false
        type: boolean
        default: true
      xcode:
        description: "Xcode: latest-stable = el más reciente estable de la Mac de GitHub (o uno exacto, p. ej. 26.5)"
        required: false
        type: string
        default: latest-stable
      firmar_archive:
        description: "Firmar también el .xcarchive (crea un certificado de desarrollo en cada ejecución; solo si la exportación falla)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  testflight:
    name: Compilar y subir a TestFlight
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      PROJECT: ios/App/App.xcodeproj
      SCHEME: App
    steps:
      - name: Revisar que estén los secretos
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          faltan=()
          [ -n "$ASC_KEY_ID" ]    || faltan+=(APP_STORE_CONNECT_KEY_ID)
          [ -n "$ASC_ISSUER_ID" ] || faltan+=(APP_STORE_CONNECT_ISSUER_ID)
          [ -n "$ASC_KEY_P8" ]    || faltan+=(APP_STORE_CONNECT_KEY_P8_BASE64)
          [ -n "$APPLE_TEAM_ID" ] || faltan+=(APPLE_TEAM_ID)
          if [ ${#faltan[@]} -gt 0 ]; then
            echo "::error title=Faltan secretos::Agrega ${faltan[*]} en Settings → Secrets and variables → Actions (ver docs/app-store.md, sección 'Compilar en la nube')."
            exit 1
          fi
          [[ "$ASC_KEY_ID" =~ ^[A-Za-z0-9]{10}$ ]] || { echo "::error::APP_STORE_CONNECT_KEY_ID debe tener 10 letras/números."; exit 1; }
          [[ "$APPLE_TEAM_ID" =~ ^[A-Za-z0-9]{10}$ ]] || { echo "::error::APPLE_TEAM_ID debe tener 10 letras/números."; exit 1; }
          [[ "$ASC_ISSUER_ID" =~ ^[0-9A-Fa-f-]{36}$ ]] || { echo "::error::APP_STORE_CONNECT_ISSUER_ID debe verse así: 1a2b3c4d-1a2b-1a2b-1a2b-1a2b3c4d5e6f."; exit 1; }

      - name: Descargar el código
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Elegir Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ inputs.xcode || 'latest-stable' }}

      - name: Versiones de la Mac
        run: |
          sw_vers
          xcodebuild -version
          echo "SDK de iOS: $(xcrun --sdk iphoneos --show-sdk-version)"

      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Exportar la interfaz (Next estático → out/)
        run: npm run build:app

      - name: Copiar la interfaz al proyecto de iOS
        run: npx cap sync ios

      - name: Preparar la llave de App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/private_keys"
          key="$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          if grep -q "BEGIN PRIVATE KEY" <<< "$ASC_KEY_P8"; then
            printf '%s\n' "$ASC_KEY_P8" > "$key"            # pegaron el texto del .p8
          else
            printf '%s' "$ASC_KEY_P8" | tr -d '\r\n\t ' | base64 --decode > "$key" 2>/dev/null || true
          fi
          if ! grep -q "BEGIN PRIVATE KEY" "$key" 2>/dev/null; then
            echo "::error title=Llave ilegible::APP_STORE_CONNECT_KEY_P8_BASE64 no contiene un archivo .p8 válido (en base64 o como texto)."
            exit 1
          fi
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"

      - name: Calcular versión
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          pbx="$PROJECT/project.pbxproj"
          version="$INPUT_VERSION"
          if [ -z "$version" ]; then
            version=$(grep -m1 -oE 'MARKETING_VERSION = [^;]+;' "$pbx" | sed -E 's/MARKETING_VERSION = "?([^";]+)"?;/\1/' || true)
          fi
          if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "::error title=Versión inválida::Usa de 1 a 3 números separados por punto, p. ej. 1.0.1 (ahora: '$version')."
            exit 1
          fi
          # Número de compilación = fecha y hora UTC (AAAAMMDD.HHMM): siempre mayor que el anterior y
          # mayor que las compilaciones subidas a mano desde Xcode (1, 2, 3…).
          build=$(date -u +%Y%m%d.%H%M)
          bundle_id=$(grep -m1 -oE 'PRODUCT_BUNDLE_IDENTIFIER = [^;]+;' "$pbx" | sed -E 's/PRODUCT_BUNDLE_IDENTIFIER = "?([^";]+)"?;/\1/' || true)
          {
            echo "version=$version"
            echo "build=$build"
            echo "bundle_id=$bundle_id"
          } >> "$GITHUB_OUTPUT"
          echo "Versión $version ($build) de $bundle_id"

      - name: Resolver paquetes de Swift
        run: |
          mkdir -p "$RUNNER_TEMP/registros"
          xcodebuild -list -project "$PROJECT"
          xcodebuild -resolvePackageDependencies -project "$PROJECT" -scheme "$SCHEME" \
            > "$RUNNER_TEMP/registros/paquetes.log" 2>&1 \
            || { tail -n 60 "$RUNNER_TEMP/registros/paquetes.log"; echo "::error::No se pudieron descargar los paquetes de Swift (Capacitor)."; exit 1; }
          tail -n 15 "$RUNNER_TEMP/registros/paquetes.log"

      - name: Compilar el archivo (xcodebuild archive)
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
          FIRMAR_ARCHIVE: ${{ inputs.firmar_archive }}
        run: |
          log="$RUNNER_TEMP/registros/archive.log"
          args=(
            -project "$PROJECT"
            -scheme "$SCHEME"
            -configuration Release
            -destination "generic/platform=iOS"
            -archivePath "$RUNNER_TEMP/Marea.xcarchive"
            MARKETING_VERSION="$VERSION"
            CURRENT_PROJECT_VERSION="$BUILD"
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID"
          )
          if [ "$FIRMAR_ARCHIVE" = "true" ]; then
            args+=(
              CODE_SIGN_STYLE=Automatic
              -allowProvisioningUpdates
              -authenticationKeyPath "$ASC_KEY_PATH"
              -authenticationKeyID "$ASC_KEY_ID"
              -authenticationKeyIssuerID "$ASC_ISSUER_ID"
            )
          else
            # Sin firmar aquí: la exportación firma con el certificado de distribución en la nube.
            args+=(CODE_SIGNING_ALLOWED=NO)
          fi
          echo "Compilando… (el registro completo queda en Artifacts → registros-ios)"
          if ! xcodebuild "${args[@]}" archive > "$log" 2>&1; then
            grep -E "error:|\*\* ARCHIVE" "$log" | tail -n 40 || true
            tail -n 40 "$log"
            echo "::error title=Falló la compilación::Revisa el registro archive.log en Artifacts → registros-ios."
            exit 1
          fi
          grep -E "\*\* ARCHIVE SUCCEEDED \*\*" "$log"

      - name: Firmar y ${{ inputs.subir_a_testflight && 'subir a TestFlight' || 'exportar el .ipa' }}
        id: exportar
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SUBIR: ${{ inputs.subir_a_testflight }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
          BUNDLE_ID: ${{ steps.version.outputs.bundle_id }}
        run: |
          log="$RUNNER_TEMP/registros/export.log"
          plist="$RUNNER_TEMP/registros/ExportOptions.plist"
          destino=export
          [ "$SUBIR" = "true" ] && destino=upload
          cat > "$plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>${destino}</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          EOF
          plutil -lint "$plist"

          salida="$RUNNER_TEMP/exportado"
          if ! xcodebuild -exportArchive \
                -archivePath "$RUNNER_TEMP/Marea.xcarchive" \
                -exportPath "$salida" \
                -exportOptionsPlist "$plist" \
                -allowProvisioningUpdates \
                -authenticationKeyPath "$ASC_KEY_PATH" \
                -authenticationKeyID "$ASC_KEY_ID" \
                -authenticationKeyIssuerID "$ASC_ISSUER_ID" > "$log" 2>&1 \
             || ! grep -qE "EXPORT SUCCEEDED|Upload succeeded" "$log"; then
            grep -iE "error|failed" "$log" | tail -n 40 || true
            if grep -qiE "cloud signing permission|cloud-managed|DISTRIBUTION_MANAGED|FORBIDDEN" "$log"; then
              echo "::error title=Permiso de firma::La llave API necesita rol Admin para usar el certificado de distribución en la nube. Crea una llave 'Team' con acceso Admin (docs/app-store.md)."
            elif grep -qiE "No suitable application records|Could not find.*app|app record" "$log"; then
              echo "::error title=Falta la app en App Store Connect::Crea primero la app con el bundle id $BUNDLE_ID en App Store Connect → Apps → + (docs/app-store.md)."
            elif grep -qiE "bundle version must be higher|has already been (used|uploaded)|CFBundleVersion" "$log"; then
              echo "::error title=Número de compilación repetido::Ya existe una compilación con ese número. Vuelve a correr el workflow (usa la hora actual)."
            elif grep -qiE "agreement" "$log"; then
              echo "::error title=Acuerdo pendiente::Acepta los acuerdos pendientes en App Store Connect → Business (o en developer.apple.com → Account)."
            else
              echo "::error title=Falló la exportación::Revisa export.log en Artifacts → registros-ios."
            fi
            exit 1
          fi

          if [ "$destino" = "upload" ]; then
            echo "Subido a App Store Connect. Aparecerá en TestFlight cuando Apple termine de procesarlo."
          else
            ipa=$(find "$salida" -maxdepth 1 -name '*.ipa' | head -n1)
            [ -n "$ipa" ] || { echo "::error::No se generó el .ipa."; exit 1; }
            revision="$RUNNER_TEMP/revision-ipa"
            rm -rf "$revision" && mkdir -p "$revision"
            unzip -q "$ipa" -d "$revision"
            app=$(find "$revision/Payload" -maxdepth 1 -name '*.app' | head -n1)
            codesign --verify --deep --strict "$app"
            codesign -dv "$app" 2>&1 | grep -E "^(Identifier|Authority|TeamIdentifier)=" | head -n 4
            final="$RUNNER_TEMP/marea-${VERSION}-${BUILD}.ipa"
            mv "$ipa" "$final"
            echo "ipa=$final" >> "$GITHUB_OUTPUT"
          fi
          echo "destino=$destino" >> "$GITHUB_OUTPUT"

      - name: Guardar el .ipa (Artifacts)
        if: steps.exportar.outputs.ipa != ''
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.exportar.outputs.ipa }}
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Guardar registros (Artifacts)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: registros-ios
          path: |
            ${{ runner.temp }}/registros/
            ${{ runner.temp }}/exportado/*.plist
            ${{ runner.temp }}/exportado/*.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Resumen
        if: always() && steps.version.outputs.build != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
          BUNDLE_ID: ${{ steps.version.outputs.bundle_id }}
          DESTINO: ${{ steps.exportar.outputs.destino }}
          RESULTADO: ${{ steps.exportar.outcome }}
        run: |
          case "$RESULTADO:$DESTINO" in
            success:upload) texto="Subido a App Store Connect. En 5–30 minutos aparece en **TestFlight** (te llega un correo de Apple cuando termina de procesarse)." ;;
            success:export) texto="Listo el archivo **marea-$VERSION-$BUILD.ipa** en *Artifacts* (no se subió). Puedes subirlo con la app Transporter de Apple." ;;
            *) texto="No terminó. Revisa el paso que falló y los registros en *Artifacts → registros-ios*." ;;
          esac
          {
            echo "## Marea para iPhone y iPad"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Bundle ID | \`$BUNDLE_ID\` |"
            echo "| Versión | $VERSION |"
            echo "| Compilación | $BUILD |"
            echo "| Xcode | $(xcodebuild -version | head -n1) |"
            echo ""
            echo "$texto"
            echo ""
            echo "Guía: \`docs/app-store.md\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Borrar la llave de la máquina
        if: always()
        run: rm -rf "$RUNNER_TEMP/private_keys"
