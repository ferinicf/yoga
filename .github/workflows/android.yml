# Marea para Android (Google Play): compila el paquete .aab firmado con la interfaz EMPAQUETADA
# dentro de la app (Capacitor + export estático de Next en out/). La web de Vercel no cambia.
#
# Cuándo corre
#   - A mano: GitHub → Actions → "Android (Google Play)" → Run workflow.
#   - Al subir una etiqueta de versión:  git tag v1.0.1 && git push origin v1.0.1
#     (la versión visible queda "1.0.1").
#
# Qué entrega
#   - El .aab firmado, en la sección "Artifacts" de la ejecución (se descarga tal cual).
#   - Opcional: lo sube a Google Play (pista de pruebas internas) SOLO si existe el secreto
#     PLAY_SERVICE_ACCOUNT_JSON. Sin ese secreto, la subida se omite y el .aab se sube a mano.
#
# Secretos (GitHub → Settings → Secrets and variables → Actions). Guía: docs/publicar-app.md
#   ANDROID_KEYSTORE_BASE64    llave de subida (.jks) convertida a base64 (la crea android-keystore.yml)
#   ANDROID_KEYSTORE_PASSWORD  contraseña del almacén de llaves
#   ANDROID_KEY_ALIAS          alias de la llave (p. ej. marea_upload)
#   ANDROID_KEY_PASSWORD       contraseña de la llave (en llaves PKCS12 es la misma del almacén)
#   PLAY_SERVICE_ACCOUNT_JSON  (opcional) JSON de la cuenta de servicio de Google Play
# Variable opcional (Settings → Secrets and variables → Actions → pestaña Variables):
#   ANDROID_VERSION_CODE_OFFSET  número que se suma al versionCode (si alguna vez subiste
#                                versiones desde otro lado, p. ej. Codemagic, y hay que "brincarlas").

name: Android (Google Play)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión visible (versionName), p. ej. 1.0.1. Vacío = la de android/app/build.gradle"
        required: false
        type: string
      subir_a_play:
        description: "Subir a Google Play (solo si existe el secreto PLAY_SERVICE_ACCOUNT_JSON)"
        required: false
        type: boolean
        default: true
      pista:
        description: "Pista de Google Play: internal = pruebas internas, alpha = prueba cerrada"
        required: false
        type: choice
        default: internal
        options:
          - internal
          - alpha
      estado:
        description: "Estado de la versión en Play (draft mientras la app nunca se haya publicado en ninguna pista)"
        required: false
        type: choice
        default: completed
        options:
          - completed
          - draft
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  aab:
    name: Compilar .aab firmado
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Los secretos no se pueden usar directo en "if:"; aquí solo se guarda si existen (true/false).
      HAS_PLAY_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - name: Revisar que estén los secretos de firma
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          faltan=()
          [ -n "$KS_B64" ]    || faltan+=(ANDROID_KEYSTORE_BASE64)
          [ -n "$KS_PASS" ]   || faltan+=(ANDROID_KEYSTORE_PASSWORD)
          [ -n "$KEY_ALIAS" ] || faltan+=(ANDROID_KEY_ALIAS)
          [ -n "$KEY_PASS" ]  || faltan+=(ANDROID_KEY_PASSWORD)
          if [ ${#faltan[@]} -gt 0 ]; then
            echo "::error title=Faltan secretos de firma::Agrega ${faltan[*]} en Settings → Secrets and variables → Actions. Si todavía no tienes llave de subida, corre primero el workflow 'Android: generar llave de subida' (ver docs/google-play.md)."
            exit 1
          fi

      - name: Descargar el código
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Java 21 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            android/*.gradle
            android/app/*.gradle
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          # compileSdk/targetSdk 36 (Android 16): Google Play lo exige a las apps nuevas desde el 31/08/2026.
          packages: platform-tools platforms;android-36

      - name: Calcular versión
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          OFFSET: ${{ vars.ANDROID_VERSION_CODE_OFFSET }}
        run: |
          gradle_file=android/app/build.gradle
          offset="${OFFSET:-0}"
          if ! [[ "$offset" =~ ^[0-9]+$ ]]; then
            echo "::error title=Variable inválida::ANDROID_VERSION_CODE_OFFSET debe ser un número entero (ahora: '$offset')."
            exit 1
          fi
          # versionCode = número de ejecución de este workflow (+ offset): siempre crece.
          code=$(( GITHUB_RUN_NUMBER + offset ))

          # versionName: etiqueta v1.2.3 → 1.2.3; si no, lo que se escribió al lanzar; si no, el de build.gradle.
          name="$INPUT_VERSION"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then name="${GITHUB_REF_NAME#v}"; fi
          if [ -z "$name" ]; then
            name=$(grep -m1 -oE 'versionName[[:space:]]+"[^"]+"' "$gradle_file" | cut -d'"' -f2 || true)
          fi
          if ! [[ "$name" =~ ^[0-9][0-9A-Za-z.+-]{0,49}$ ]]; then
            echo "::error title=Versión inválida::Usa algo como 1.0.1 (ahora: '$name')."
            exit 1
          fi

          app_id=$(grep -m1 -oE 'applicationId[[:space:]]+"[^"]+"' "$gradle_file" | cut -d'"' -f2 || true)
          if [ -z "$app_id" ]; then
            echo "::error::No encontré applicationId en $gradle_file."
            exit 1
          fi

          {
            echo "code=$code"
            echo "name=$name"
            echo "app_id=$app_id"
          } >> "$GITHUB_OUTPUT"
          echo "Versión $name (versionCode $code) de $app_id"

      - name: Instalar dependencias
        run: npm ci

      - name: Exportar la interfaz (Next estático → out/)
        run: npm run build:app

      - name: Copiar la interfaz al proyecto de Android
        run: npx cap sync android

      - name: Poner versionCode y versionName
        env:
          CODE: ${{ steps.version.outputs.code }}
          NAME: ${{ steps.version.outputs.name }}
        run: |
          gradle_file=android/app/build.gradle
          # Solo en esta máquina temporal; el archivo del repositorio no cambia.
          # Si build.gradle tiene los números escritos, se reemplazan. Si los lee de propiedades
          # (-PmareaVersionCode / -PmareaVersionName), se pasan también al compilar.
          sed -i -E "s/^([[:space:]]*)versionCode[[:space:]]+[0-9]+[[:space:]]*$/\1versionCode $CODE/" "$gradle_file"
          sed -i -E "s/^([[:space:]]*)versionName[[:space:]]+\"[^\"]*\"[[:space:]]*$/\1versionName \"$NAME\"/" "$gradle_file"
          grep -nE 'versionCode|versionName' "$gradle_file"

      - name: Preparar la llave de subida
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          ks="$RUNNER_TEMP/marea-upload.keystore"
          # Acepta el base64 en una sola línea o en varias (se quitan saltos y espacios).
          if ! printf '%s' "$KS_B64" | tr -d '\r\n\t ' | base64 --decode > "$ks" 2>/dev/null || [ ! -s "$ks" ]; then
            echo "::error title=Llave ilegible::ANDROID_KEYSTORE_BASE64 no es un base64 válido del archivo .jks."
            exit 1
          fi
          chmod 600 "$ks"
          # Comprueba contraseña y alias antes de compilar (falla con un mensaje claro).
          if ! keytool -list -keystore "$ks" -storepass:env KS_PASS -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error title=Llave o contraseña incorrecta::No pude abrir la llave con ANDROID_KEYSTORE_PASSWORD y ANDROID_KEY_ALIAS. Revisa que correspondan a ese .jks."
            exit 1
          fi
          echo "KEYSTORE_FILE=$ks" >> "$GITHUB_ENV"

      - name: Compilar el .aab firmado
        working-directory: android
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          CODE: ${{ steps.version.outputs.code }}
          NAME: ${{ steps.version.outputs.name }}
        run: |
          chmod +x gradlew
          # android.injected.signing.* es la misma vía que usa Android Studio para "Generate Signed Bundle":
          # firma el release sin guardar contraseñas en el repositorio.
          ./gradlew --no-daemon --stacktrace bundleRelease \
            -PmareaVersionCode="$CODE" \
            -PmareaVersionName="$NAME" \
            -Pandroid.injected.signing.store.file="$KEYSTORE_FILE" \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"

      - name: Verificar firma y versión
        id: salida
        env:
          CODE: ${{ steps.version.outputs.code }}
          NAME: ${{ steps.version.outputs.name }}
        run: |
          aab=$(ls android/app/build/outputs/bundle/release/*.aab 2>/dev/null | head -n1 || true)
          if [ -z "$aab" ]; then
            echo "::error::No se generó el .aab."
            exit 1
          fi
          verificacion=$(jarsigner -verify "$aab" 2>&1 || true)
          if ! grep -q "jar verified" <<< "$verificacion"; then
            echo "::error title=Sin firma::El .aab no quedó firmado."
            exit 1
          fi
          # Huella del certificado de subida: debe coincidir con Play Console → Integridad de la app.
          certificado=$(keytool -printcert -jarfile "$aab" 2>&1 || true)
          sha256=$(grep -m1 -E 'SHA256:' <<< "$certificado" | sed -E 's/.*SHA256:[[:space:]]*//' || true)

          # Revisa en el manifiesto final que el versionCode sea el esperado.
          codes=$(find android/app/build/intermediates -path '*elease*' -name AndroidManifest.xml -print0 2>/dev/null \
            | xargs -0 -r grep -ohE 'android:versionCode="[0-9]+"' | grep -oE '[0-9]+' | sort -u | tr '\n' ' ' || true)
          if [ -n "$codes" ] && [ "$codes" != "$CODE " ]; then
            echo "::error title=versionCode incorrecto::El manifiesto quedó con versionCode $codes y se esperaba $CODE. Revisa versionCode en android/app/build.gradle."
            exit 1
          fi
          [ -n "$codes" ] || echo "::warning::No pude leer el versionCode del manifiesto final (se esperaba $CODE)."

          mkdir -p "$RUNNER_TEMP/salida"
          final="$RUNNER_TEMP/salida/marea-${NAME}-${CODE}.aab"
          cp "$aab" "$final"
          {
            echo "aab=$final"
            echo "sha256=$sha256"
          } >> "$GITHUB_OUTPUT"
          echo "Listo: $(basename "$final") — certificado de subida SHA-256 $sha256"

      - name: Guardar el .aab (Artifacts)
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.salida.outputs.aab }}
          # Un solo archivo sin comprimir: se descarga directo el .aab.
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Subir a Google Play
        id: play
        if: env.HAS_PLAY_ACCOUNT == 'true' && (github.event_name == 'push' || inputs.subir_a_play)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ steps.version.outputs.app_id }}
          releaseFiles: ${{ steps.salida.outputs.aab }}
          releaseName: ${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})
          track: ${{ inputs.pista || 'internal' }}
          status: ${{ inputs.estado || 'completed' }}

      - name: Resumen
        if: always() && steps.salida.outputs.aab != ''
        env:
          CODE: ${{ steps.version.outputs.code }}
          NAME: ${{ steps.version.outputs.name }}
          APP_ID: ${{ steps.version.outputs.app_id }}
          SHA256: ${{ steps.salida.outputs.sha256 }}
          PLAY_OUTCOME: ${{ steps.play.outcome }}
          TRACK: ${{ inputs.pista || 'internal' }}
        run: |
          case "$PLAY_OUTCOME" in
            success) play="Subido a Google Play, pista **$TRACK**." ;;
            failure) play="La subida a Google Play **falló** (revisa el paso \"Subir a Google Play\"). El .aab está en Artifacts para subirlo a mano." ;;
            *)
              if [ "$HAS_PLAY_ACCOUNT" != "true" ]; then
                play="No se subió a Google Play: falta el secreto PLAY_SERVICE_ACCOUNT_JSON (es opcional). Sube el .aab a mano en Play Console."
              else
                play="No se subió a Google Play (se desactivó al lanzar el workflow)."
              fi ;;
          esac
          {
            echo "## Marea para Android"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| App | \`$APP_ID\` |"
            echo "| Versión | $NAME |"
            echo "| versionCode | $CODE |"
            echo "| Certificado de subida (SHA-256) | \`$SHA256\` |"
            echo ""
            echo "$play"
            echo ""
            echo "El archivo **marea-$NAME-$CODE.aab** está abajo, en *Artifacts*. Guía: \`docs/google-play.md\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Borrar la llave de la máquina
        if: always()
        run: rm -f "$RUNNER_TEMP/marea-upload.keystore"
